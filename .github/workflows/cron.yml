name: "Cron Jobs"

on:
  # Automatic cron is paused for the MVP while Supabase storage and search
  # quality are being validated. Keep manual dispatch for targeted operations.
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually'
        required: true
        default: 'uptime'
        type: choice
        options:
          - uptime
          - drift
          - ingest
          - enrich
          - reset

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Execute Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          SANDBOX_URL: ${{ secrets.SANDBOX_URL }}
          SANDBOX_AUTH_TOKEN: ${{ secrets.SANDBOX_AUTH_TOKEN }}
          LOCAL_INGEST_CONCURRENCY: "20"
          LOCAL_INGEST_PROGRESS_EVERY: "25"
          OFFICIAL_REGISTRY_TIMEOUT_MS: "60000"
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.job }}" == "uptime" ]; then
              bun run src/scripts/cron-uptime.ts
            elif [ "${{ github.event.inputs.job }}" == "drift" ]; then
              bun run src/scripts/cron-schema-drift.ts
            elif [ "${{ github.event.inputs.job }}" == "ingest" ]; then
              bun run src/scripts/run-ingest-local.ts all
            elif [ "${{ github.event.inputs.job }}" == "enrich" ]; then
              bun run src/scripts/run-ingest-local.ts enrich
            elif [ "${{ github.event.inputs.job }}" == "reset" ]; then
              bun run src/scripts/cron-reset-calls.ts
            fi
          fi

          echo "Manual cron workflow complete."
