name: "Cron Jobs"

on:
  schedule:
    # ── Uptime Check (every 15 minutes) ──
    - cron: "*/15 * * * *"
    # ── Schema Drift (every 6 hours) ──
    - cron: "0 */6 * * *"
    # ── Reset Calls & Ingest (every day at midnight) ──
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually'
        required: true
        default: 'uptime'
        type: choice
        options:
          - uptime
          - drift
          - ingest
          - reset

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Execute Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          SANDBOX_URL: ${{ secrets.SANDBOX_URL }}
          SANDBOX_AUTH_TOKEN: ${{ secrets.SANDBOX_AUTH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.job }}" == "uptime" ]; then
              bun run src/scripts/cron-uptime.ts
            elif [ "${{ github.event.inputs.job }}" == "drift" ]; then
              bun run src/scripts/cron-schema-drift.ts
            elif [ "${{ github.event.inputs.job }}" == "ingest" ]; then
              bun run src/scripts/cron-ingest.ts
            elif [ "${{ github.event.inputs.job }}" == "reset" ]; then
              bun run src/scripts/cron-reset-calls.ts
            fi
            exit 0
          fi
          
          # Scheduled executions
          if [ "${{ github.event.schedule }}" == "*/15 * * * *" ]; then
             echo "Running Uptime Check..."
             bun run src/scripts/cron-uptime.ts
          elif [ "${{ github.event.schedule }}" == "0 */6 * * *" ]; then
             echo "Running Schema Drift..."
             bun run src/scripts/cron-schema-drift.ts
          elif [ "${{ github.event.schedule }}" == "0 0 * * *" ]; then
             echo "Running Reset Calls & Ingest..."
             bun run src/scripts/cron-reset-calls.ts
             bun run src/scripts/cron-ingest.ts
          fi
