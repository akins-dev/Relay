version: '3.9'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/registry.db
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production-min-32-chars}
      - NEXT_PUBLIC_APP_URL=${APP_URL:-http://localhost:3000}
    volumes:
      - registry_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  registry_data:
